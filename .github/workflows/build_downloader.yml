name: Build Cross-Platform Downloader

on:
  workflow_dispatch: # 网页上手动点击按钮立即打包
  push:
    paths:
      - 'tools/downloader/**' # 仅当修改了下载器代码时才触发构建
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/downloader/requirements.txt

      - name: Build Windows Executable
        working-directory: tools/downloader
        run: |
          pyinstaller --noconsole --onefile --name "DriveDownloader-Windows" downloader.py

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: DriveDownloader-Windows
          path: tools/downloader/dist/DriveDownloader-Windows.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/downloader/requirements.txt

      - name: Build macOS App Bundle
        working-directory: tools/downloader
        run: |
          pyinstaller --noconsole --windowed --name "DriveDownloader" downloader.py
          cd dist
          zip -r -y DriveDownloader-macOS.zip DriveDownloader.app

      - name: Upload macOS Zip
        uses: actions/upload-artifact@v4
        with:
          name: DriveDownloader-macOS
          path: tools/downloader/dist/DriveDownloader-macOS.zip